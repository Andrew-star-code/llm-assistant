# Политика модерации (§9.6): категории скрытого репорта report_incident, уровни, текст отказа,
# помощь при угрозе себе и категории guard-модели. Меняется без правки кода; читается при старте
# и при изменении файла.
# TODO(question): итоговый список категорий и маршрут инцидентов согласовать с ИБ, HR и юристами.

categories:
  - code: illegal
    name: Противоправные действия
    description: просьбы помочь совершить преступление, мошенничество, обойти закон
  - code: threats
    name: Угрозы
    description: угрозы жизни, здоровью или имуществу людей
  - code: extremism
    name: Экстремизм
    description: призывы к насилию, экстремистские материалы
  - code: malware
    name: Вредоносный код и взлом
    description: создание вредоносного ПО, взлом систем и учётных записей
  - code: personal_data
    name: Чужие персональные данные
    description: попытки получить персональные данные других сотрудников или клиентов
  - code: jailbreak
    name: Обход ограничений
    description: попытки заставить ассистента нарушить правила или раскрыть служебные инструкции
  - code: self_harm
    name: Угроза самому себе
    description: признаки намерения причинить вред себе
  - code: other
    name: Иное
    description: другое явное нарушение правил компании

severities: [low, medium, high, critical]

refusal: "Извините, с этим запросом я помочь не могу."

# TODO(question): контакты помощи — согласовать с HR (телефон психолога, горячая линия).
self_harm_help: >-
  Если вам сейчас тяжело, пожалуйста, не оставайтесь с этим один на один: поговорите с близким
  человеком или обратитесь в службу экстренной психологической помощи по телефону 8-800-2000-122
  (бесплатно, круглосуточно). При угрозе жизни звоните 112.

# Категории ответа Qwen3Guard; блокировку отдельных категорий включает админ («Настройки»).
guard_categories:
  - Violent
  - Non-violent Illegal Acts
  - Sexual Content or Sexual Acts
  - PII
  - Suicide & Self-Harm
  - Unethical Acts
  - Politically Sensitive Topics
  - Copyright Violation
  - Jailbreak
