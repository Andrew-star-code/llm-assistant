# Раздача статики SPA. Публичный gateway (TLS, /api, SSE без буферизации) — deploy/nginx, этап 10.
# Внимание: add_header внутри location отменяет заголовки уровня server, поэтому заголовки
# безопасности повторяются в каждом location.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    }
}
