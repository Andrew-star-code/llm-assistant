# Сбор метрик (§16.6). Compose мониторинга, экспортёры и Grafana — этап 10; этот файл и
# alerts.yml проверяются `make test-monitoring` (promtool) уже сейчас.
#
# Имена целей — имена сервисов compose. Prometheus должен быть в одной сети с приложением и
# моделями; наружу /metrics не публикуется (nginx его не проксирует).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  # --- приложение -------------------------------------------------------------------------
  - job_name: api                 # HTTP, SSE, длина очереди генерации, число исполнителей
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]

  - job_name: generator           # ответы, TTFT, токены, инструменты (generation.metrics_port)
    static_configs:
      - targets: ["generator:9100"]

  # --- модели (vLLM отдаёт /metrics на порту API) -----------------------------------------
  - job_name: llm
    static_configs:
      - targets: ["llm-chat:8000"]
        labels: {role: chat}
      - targets: ["llm-coder:8000"]
        labels: {role: coder}
      - targets: ["llm-utility:8000"]
        labels: {role: utility}
      - targets: ["llm-guard:8000"]
        labels: {role: guard}

  # --- данные и хост (экспортёры появятся в compose мониторинга на этапе 10) ---------------
  - job_name: qdrant
    static_configs:
      - targets: ["qdrant:6333"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: dcgm                # GPU: загрузка, память, температура
    static_configs:
      - targets: ["dcgm-exporter:9400"]
