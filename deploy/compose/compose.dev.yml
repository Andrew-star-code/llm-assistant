# Дев-стенд (§16.1): моки вместо AD и моделей, hot reload бэкенда и фронтенда.
# Все порты слушают только 127.0.0.1.
services:
  postgres:
    ports: ["127.0.0.1:5432:5432"]
  redis:
    ports: ["127.0.0.1:6379:6379"]
  qdrant:
    ports: ["127.0.0.1:6333:6333"]

  api:
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000",
              "--reload", "--reload-dir", "/srv/backend/app", "--reload-dir", "/srv/config", "--no-access-log",
              "--timeout-graceful-shutdown", "5"]
    environment:
      APP_ENV: dev
    # Локальные переопределения APP_* (не в git), например адрес живой модели вместо fake-llm.
    env_file:
      - path: ./api.local.env
        required: false
    volumes:
      - ../../backend/app:/srv/backend/app:ro
      - ../../config:/srv/config:ro
      - mock-ad-export:/run/mock-ad:ro
      - api-storage:/srv/storage
      - ${KB_IMPORT_DIR:-./import}:/srv/import:ro
    secrets:
      - source: ldap_bind_password
        target: ldap_bind_password
    extra_hosts: ["host.docker.internal:host-gateway"]   # модель на машине разработчика (Ollama)
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      fake-llm: {condition: service_healthy}
      mock-ad: {condition: service_healthy}

  worker:
    # Перезапуск при изменении кода (у Celery нет своего reload). Ждёт готовый embed: при старте
    # воркер заново разбирает зависшие вложения, а без эмбеддингов они остались бы без поиска.
    depends_on:
      embed: {condition: service_healthy}
    command: ["watchfiles", "--filter", "python",
              "celery -A app.workers.celery_app worker -Q files -c 2 --without-gossip --without-mingle -n files@%h",
              "/srv/backend/app"]
    environment:
      APP_ENV: dev
    env_file:
      - path: ./api.local.env
        required: false
    volumes:
      - ../../backend/app:/srv/backend/app:ro
      - ../../config:/srv/config:ro
      - api-storage:/srv/storage
    extra_hosts: ["host.docker.internal:host-gateway"]

  worker-kb:
    depends_on:
      embed: {condition: service_healthy}
    command: ["watchfiles", "--filter", "python",
              "celery -A app.workers.celery_app worker -Q kb -c 2 --without-gossip --without-mingle -n kb@%h",
              "/srv/backend/app"]
    environment:
      APP_ENV: dev
    env_file:
      - path: ./api.local.env
        required: false
    volumes:
      - ../../backend/app:/srv/backend/app:ro
      - ../../config:/srv/config:ro
      - api-storage:/srv/storage
      - ${KB_IMPORT_DIR:-./import}:/srv/import:ro
    extra_hosts: ["host.docker.internal:host-gateway"]

  scheduler:
    environment:
      APP_ENV: dev
    volumes:
      - ../../backend/app:/srv/backend/app:ro
      - ../../config:/srv/config:ro

  migrate:
    volumes:
      - ../../backend/app:/srv/backend/app:ro
      - ../../backend/migrations:/srv/backend/migrations:ro
      - ../../config:/srv/config:ro

  fake-llm:
    build:
      context: ../..
      dockerfile: services/fake-llm/Dockerfile
    image: ai-assistant/fake-llm:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      FAKE_LLM_SLOW_DELAY_S: "0.3"
    ports: ["127.0.0.1:8081:8080"]

  embed:
    # bge-m3 на CPU через text-embeddings-inference: OpenAI-совместимый /v1/embeddings.
    # Первый запуск скачивает веса (~2,3 ГБ) в том embed-cache; дальше работает офлайн.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-m3", "--port", "80", "--max-client-batch-size", "64"]
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - embed-cache:/data
    ports: ["127.0.0.1:8082:80"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      # Первое скачивание весов на медленном канале идёт дольше 10 минут — ждём до 30.
      retries: 180
      start_period: 30s

  rerank:
    # Настоящий реранкер bge-reranker-v2-m3 в text-embeddings-inference (CPU) — для `make eval-rag`
    # и ручной проверки поиска. Не входит в `make dev-up`: `make dev-models-up` (профиль models).
    # Подключение api — deploy/compose/api.local.env (см. api.local.env.example), формат API — tei.
    # Прогрев двух TEI одновременно (embed ~12 ГБ на CPU + rerank до 7 ГБ) не помещается в память
    # WSL2 по умолчанию: rerank стартует после готового embed и не перезапускается сам вместе с
    # Docker (иначе оба прогреваются разом) — после перезагрузки снова `make dev-models-up`.
    profiles: [models]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    restart: "no"
    depends_on:
      embed: {condition: service_healthy}
    command: ["--model-id", "BAAI/bge-reranker-v2-m3", "--port", "80", "--max-client-batch-size", "64"]
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - embed-cache:/data
    ports: ["127.0.0.1:8083:80"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 180
      start_period: 30s

  mock-mssql:
    # Тестовый MS SQL (§16.1): SQL Server 2022 Developer с телефонным справочником dbo.v_phonebook
    # (deploy/mock-mssql/seed.sql) и логином dg_reader только на чтение. Нужно ~2 ГБ памяти.
    build: ../mock-mssql
    image: ai-assistant/mock-mssql:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      MSSQL_SA_PASSWORD: ${MOCK_MSSQL_SA_PASSWORD:-Dev-Sa-Passw0rd!}
      MSSQL_READER_PASSWORD: ${MSSQL_PASSWORD:-Dev-Reader-Passw0rd!}
    volumes:
      - mock-mssql-data:/var/opt/mssql
    ports: ["127.0.0.1:1433:1433"]

  data-gateway:
    environment:
      DG_EMBED_URL: http://embed:80/v1      # похожие примеры «вопрос → SQL» (bge-m3 стенда)
    ports: ["127.0.0.1:8090:8090"]
    depends_on:
      mock-mssql: {condition: service_healthy}

  docker-proxy:
    # Docker API только на чтение (§13.5): монитор моделей берёт логи контейнера упавшей модели
    # для инцидента model_health (monitoring.docker_url в config/app.dev.yaml). Разрешены только
    # GET /containers/*: остановить, запустить или создать контейнер через прокси нельзя (403).
    # Порт наружу не публикуется. В проде — такой же прокси в проекте monitoring (этап 10).
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      POST: "0"
      DISABLE_IPV6: "1"       # слушать только IPv4: в сетях Docker без IPv6 haproxy иначе не стартует
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  mock-ad:
    build: ../mock-ad
    image: ai-assistant/mock-ad:${APP_VERSION:-dev}
    restart: unless-stopped
    hostname: dc1
    domainname: corp.local
    networks:
      default:
        aliases: [dc1.corp.local]
    cap_add: [SYS_ADMIN]   # Samba пишет NT ACL в xattr security.* — только для дев-стенда
    environment:
      MOCK_AD_ADMIN_PASSWORD: ${MOCK_AD_ADMIN_PASSWORD:?задайте MOCK_AD_ADMIN_PASSWORD}
      MOCK_AD_SVC_PASSWORD: ${LDAP_BIND_PASSWORD:?задайте LDAP_BIND_PASSWORD}
      MOCK_AD_USER_PASSWORD: ${MOCK_AD_USER_PASSWORD:-Passw0rd!}
    volumes:
      - mock-ad-samba:/var/lib/samba
      - mock-ad-etc:/etc/samba
      - mock-ad-export:/export
    ports:
      - "127.0.0.1:389:389"
      - "127.0.0.1:636:636"

  frontend:
    build:
      context: ../../frontend
      target: dev
    image: ai-assistant/frontend-dev:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      npm_config_store_dir: /pnpm/store     # иначе pnpm создаёт .pnpm-store в смонтированных исходниках
    volumes:
      - ../../frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-pnpm-store:/pnpm/store
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      api: {condition: service_started}

secrets:
  ldap_bind_password:
    environment: LDAP_BIND_PASSWORD

volumes:
  embed-cache:
  mock-mssql-data:
  mock-ad-samba:
  mock-ad-etc:
  mock-ad-export:
  frontend-node-modules:
  frontend-pnpm-store:
