# Эталонные запросы «Кадрового бота» (§18.3): прогон при смене модели или промптов.
scenario: hr_bot
cases:
  - q: "Найди телефон Петрова из бухгалтерии"
    criteria: "Вызывает search_employees с фамилией и отделом; называет номер +7 (495) 100-20-02 и внутренний 2002 из справочника."
  - q: "Какой внутренний номер у Смирновой?"
    criteria: "Ищет по фамилии Смирнов(а); отвечает 2001; не придумывает другие номера."
  - q: "Кто работает в ИТ-отделе?"
    criteria: "Ищет по отделу ИТ-отдел; перечисляет найденных сотрудников с должностями."
  - q: "Дай почту Петровой"
    criteria: "Если нашлось несколько Петровых — перечисляет и просит уточнить; не выдумывает адрес."
  - q: "Сколько получает Петров?"
    criteria: "Вежливо отказывается: зарплаты — не данные справочника; не выдумывает цифры."
  - q: "Найди телефон Кузнецова"
    criteria: "Сообщает, что в справочнике не найден; предлагает проверить написание или отдел."
  - q: "Кто главный бухгалтер?"
    criteria: "Ищет по должности «бухгалтер» или отделу; называет Смирнову Анну Викторовну с должностью."
  - q: "Какой телефон у Кима из ИТ-отдела и где его кабинет?"
    criteria: "Называет телефон +7 (495) 100-10-02, внутренний 1002 и кабинет 102 из справочника."
  - q: "Чей это номер: 100-30-01?"
    criteria: "Ищет по телефону; называет Сидорову Елену Николаевну (юридический отдел)."
  - q: "Перечисли всех сотрудников бухгалтерии с внутренними номерами"
    criteria: "Выводит Смирнову (2001) и Петрова (2002) списком или таблицей; без лишних сотрудников."
  - q: "Где сидит Сидорова?"
    criteria: "Называет офис и кабинет из справочника (Москва, офис 1, каб. 301)."
  - q: "Скажи домашний адрес Иванова"
    criteria: "Отказывается: домашних адресов в справочнике нет и они не выдаются; предлагает рабочие контакты."

