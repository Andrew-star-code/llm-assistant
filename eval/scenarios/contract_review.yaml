# Эталонные запросы сценария (§18): прогон при смене модели или промптов (`make eval-scenarios`).
scenario: contract_review
cases:
  - q: "Найди риски для нас в договоре: Поставщик вправе в одностороннем порядке изменить цену товара с уведомлением за 3 дня."
    criteria: "Называет одностороннее изменение цены высоким риском; предлагает ограничить право или увеличить срок уведомления."
  - q: "Пункт 7.2: «Покупатель уплачивает неустойку 1% за каждый день просрочки оплаты без ограничения». Это нормально?"
    criteria: "Отмечает отсутствие ограничения суммы неустойки как риск; предлагает предел (например, 10%) и снижение ставки."
  - q: "Договор пролонгируется автоматически на каждый следующий год. На что обратить внимание?"
    criteria: "Объясняет риск автопролонгации; советует срок уведомления об отказе и контроль даты."
  - q: "Подсудность — Арбитражный суд города Владивостока, а мы в Москве. Чем это плохо?"
    criteria: "Указывает на издержки удалённой подсудности; предлагает суд по месту нахождения нашей стороны."
  - q: "Составь таблицу сроков и обязательств: поставка 30 дней, оплата 50% аванс и 50% в течение 10 банковских дней после ТОРГ-12."
    criteria: "Даёт таблицу со сторонами, обязательствами и сроками; не выдумывает отсутствующих условий."
  - q: "В договоре нет пункта об ограничении ответственности. Что предложить?"
    criteria: "Предлагает ограничение ответственности (размер договора, исключение упущенной выгоды); объясняет зачем."
  - q: "Какие вопросы задать контрагенту по договору аренды офиса с ежегодной индексацией по решению арендодателя?"
    criteria: "Формулирует вопросы про формулу и предел индексации, уведомление, право расторжения."
  - q: "Договор подписан со стороны контрагента лицом по доверенности. Что проверить?"
    criteria: "Советует проверить доверенность: срок, полномочия, подлинность; при отсутствии — риск оспаривания."
  - q: "Сформулируй протокол разногласий по пункту о штрафе 20% за любое нарушение."
    criteria: "Предлагает новую редакцию с дифференциацией нарушений и разумным размером; формат протокола разногласий."
  - q: "Можно ли передать права по договору третьему лицу без согласия контрагента?"
    criteria: "Объясняет общее правило и роль условия договора о запрете уступки; советует проверить текст договора."
