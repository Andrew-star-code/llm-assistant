scenario: it_support
cases:
  - q: "Не подключается VPN, пишет TLS handshake failed."
    criteria: "Связывает ошибку с устаревшим конфигом; советует получить новый в ИТ-поддержке; пошагово."
  - q: "Код 2FA не принимается при входе в VPN."
    criteria: "Советует проверить время на компьютере и синхронизацию; не просит прислать код."
  - q: "Забыл пароль от учётной записи, что делать?"
    criteria: "Направляет на портал самообслуживания или заявку; не просит назвать пароль."
  - q: "Учётная запись заблокирована после неудачных попыток входа."
    criteria: "Объясняет блокировку (на время) и как разблокировать; предлагает заявку."
  - q: "Оформи заявку в поддержку: не работает принтер на 3 этаже, бумага не застряла."
    criteria: "Составляет заявку по шаблону со всеми полями; не выдумывает ФИО, если оно не известно."
  - q: "Как распечатать конфиденциальный документ, чтобы его никто не взял из лотка?"
    criteria: "Описывает функцию Secure Print с подтверждением пропуском."
  - q: "Пришло письмо от «бухгалтерии» со ссылкой на архив и просьбой срочно открыть."
    criteria: "Распознаёт фишинг; советует не открывать, переслать в службу безопасности и удалить."
  - q: "Где взять пароль от гостевого Wi-Fi?"
    criteria: "Направляет на портал, где пароль публикуется; без выдумывания пароля."
  - q: "Компьютер показывает требование выкупа, файлы не открываются."
    criteria: "Срочно отключить сеть и сообщить в ИБ; не перезагружать бездумно, не платить."
  - q: "Как установить драйвер принтера, если нет прав администратора?"
    criteria: "Упоминает автоматическую установку через Software Center или заявку в ИТ."
