[project]
name = "ai-assistant-api"
version = "0.1.0"
description = "Корпоративный ИИ-ассистент: API (FastAPI) — чаты, оркестратор, RAG, инструменты, админ-API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyyaml>=6.0",
    "structlog>=26.1",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "redis>=8.1",
    "httpx>=0.28",
    "prometheus-client>=0.26",
    "ldap3>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
