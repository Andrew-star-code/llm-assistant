[project]
name = "data-gateway"
version = "0.1.0"
description = "Семантический слой над SQL-БД: каталог, функции, контролируемый text-to-SQL (§9.5)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pyyaml>=6.0",
    "sqlalchemy>=2.1",
    "sqlglot>=27.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
# Драйвер MS SQL: ставится в образе шлюза вместе с Microsoft ODBC Driver 18 (нужен unixODBC).
mssql = ["pyodbc>=5.2"]

[project.scripts]
data-gateway = "data_gateway.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_gateway"]
