[project]
name = "fake-llm"
version = "0.1.0"
description = "OpenAI-совместимый mock LLM со сценариями ответа для разработки и тестов"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
]

[project.scripts]
fake-llm = "fake_llm.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fake_llm"]
